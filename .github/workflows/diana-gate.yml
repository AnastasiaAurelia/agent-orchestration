name: Diana Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  diana-gate:
    name: Diana Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build gate input from PR evidence and Git diff
        env:
          DIANA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIANA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 diana/ci/build-gate-input.py
          "$GITHUB_EVENT_PATH"
          "$RUNNER_TEMP/diana-gate-input.json"

      - name: Evaluate Diana Gate
        run: |
          set +e
          python3 diana/gate/diana-gate.py "$RUNNER_TEMP/diana-gate-input.json" > "$RUNNER_TEMP/diana-gate-result.json"
          set -e
          cat "$RUNNER_TEMP/diana-gate-result.json"

      - name: Evaluate Security Gate (protected-base evaluator, Security Phase 5)
        env:
          DIANA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIANA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 diana/ci/run-security-gate.py \
            "$GITHUB_WORKSPACE" "$DIANA_BASE_SHA" "$DIANA_HEAD_SHA" "${{ github.repository }}" \
            > "$RUNNER_TEMP/security-gate-result.json"
          cat "$RUNNER_TEMP/security-gate-result.json"

      - name: Combine Diana Gate + Security Gate
        run: |
          set +e
          python3 diana/gate/diana-gate.py combine \
            "$RUNNER_TEMP/diana-gate-result.json" "$RUNNER_TEMP/security-gate-result.json" \
            > "$RUNNER_TEMP/combined-gate-result.json"
          gate_exit=$?
          set -e
          cat "$RUNNER_TEMP/combined-gate-result.json"
          python3 diana/ci/write-summary.py "$RUNNER_TEMP/combined-gate-result.json" >> "$GITHUB_STEP_SUMMARY"
          python3 diana/ci/map-gate-result.py "$gate_exit"
