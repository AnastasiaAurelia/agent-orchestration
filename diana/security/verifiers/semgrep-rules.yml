# Diana Security -- pinned, explicit Semgrep rules for live trusted
# verifier execution (Security Track remediation round A).
#
# Deliberately NOT `--config=auto` or a `p/...` registry reference: those
# depend on a live external rule registry at scan time, which is neither
# deterministic nor reproducible (rules can change or the registry can be
# unreachable). These rules are committed, versioned source -- exactly
# what runs is exactly what is reviewed. Scoped to Python only, matching
# this repository's actual composition; broadening to other languages is
# future work, not a blocker for this round.
#
# Each `id` below is referenced by diana/security/adapters/semgrep_adapter.py's
# `ILLUSTRATIVE_TEST_ONLY_RULE_MAP` (tests only) and by
# diana/security/ci_verifier_runs.py's real, production rule_map (the one
# actually trusted at runtime) -- both must stay in sync with the ids
# used here, or a real finding/clean-run for these rules would not be
# attributable to any control at all.
#
# diana.mass-assignment-bulk-bind-{py,js} (added for SEC-041 static
# coverage) are the first rules here NOT scoped to Python only --
# languages: [javascript, typescript] is used for the JS/TS half,
# matching this task's explicit JS/TS + Python requirement. Both rules
# detect only the STATIC, lexical half of SEC-041's two required_evidence
# items ("request bodies are bound through an explicit allow-list ...,
# never bulk-assigned to the full model") -- the second item ("negative
# test proving a privileged/protected field cannot be set via unexpected
# request body fields") is DYNAMIC_API and is NOT claimed by this rule or
# by semgrep_adapter.py's SEC-041 authorization. Deliberately does NOT
# attempt SEC-042 (Parameter Tampering): that control's verification.modes
# is ["SEMANTIC_REVIEW", "DYNAMIC_API"] only -- STATIC_ANALYZER is not an
# authorized capability for it, and evidence_model.py forces a control's
# result to ERROR if a run arrives from a capability outside its
# verification.modes. Mapping these findings to SEC-042 would therefore
# actively break that control's result, not just be unauthorized in
# spirit.
rules:
  - id: diana.shell-injection-via-concatenation
    languages: [python]
    severity: ERROR
    message: >-
      A shell command is built via string concatenation/formatting/f-string
      interpolation and executed with shell=True (or os.system/os.popen) --
      maps to SEC-010 (OS Command Injection).
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True)
          - pattern: subprocess.call(..., shell=True)
          - pattern: subprocess.Popen(..., shell=True)
          - pattern: os.system(...)
          - pattern: os.popen(...)

  - id: diana.template-injection-via-render
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted input is passed to a template engine's string-template
      constructor/renderer, which interprets it as template SOURCE rather
      than template DATA -- maps to SEC-011 (Server-Side Template
      Injection).
    patterns:
      - pattern-either:
          - pattern: jinja2.Template(...)
          - pattern: flask.render_template_string(...)
          - pattern: render_template_string(...)

  - id: diana.jwt-unsafe-verification
    languages: [python]
    severity: ERROR
    message: >-
      JWT decoding disables signature verification or does not pin an
      expected algorithm set -- maps to SEC-021 (JWT Signature
      Verification Errors).
    patterns:
      - pattern-either:
          - pattern: jwt.decode(..., verify=False, ...)
          - pattern: 'jwt.decode(..., options={"verify_signature": False}, ...)'
          - pattern: jwt.decode($TOKEN, $KEY)

  - id: diana.insecure-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted data is passed to an unrestricted native deserializer
      (pickle/marshal/unsafe yaml.load) rather than a safe/restricted
      format or schema -- maps to SEC-058 (Insecure Deserialization).
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: marshal.loads(...)
          - pattern: yaml.load($DATA)
          - pattern: yaml.load($DATA, Loader=yaml.Loader)
          - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)

  - id: diana.mass-assignment-bulk-bind-py
    languages: [python]
    severity: ERROR
    message: >-
      A request body is unpacked wholesale into a model constructor/update
      call (full-kwargs bulk bind), or a privileged field (role, admin
      flag, credits, limit, tier) is written directly from a request
      object, with no visible explicit allow-list -- maps to SEC-041
      (Mass Assignment), static half only. Does not claim a dynamic
      negative test; does not claim SEC-042.
    patterns:
      - pattern-either:
          # Full-kwargs bulk bind from a request/body mapping.
          - pattern: $MODEL(**request.json)
          - pattern: $MODEL(**request.POST)
          - pattern: $MODEL(**request.data)
          - pattern: $MODEL(**request.form)
          - pattern: $MODEL.objects.create(**request.json)
          - pattern: $MODEL.objects.create(**request.POST)
          - pattern: $MODEL.objects.create(**request.data)
          - pattern: $QUERYSET.update(**request.json)
          - pattern: $QUERYSET.update(**request.data)
          - pattern: $MODEL(**$DATA.dict())
          - pattern: $MODEL(**$DATA.model_dump())
          # Direct write of a named privileged field from request input.
          - pattern: $OBJ.role = request.json[...]
          - pattern: $OBJ.role = request.json.get(...)
          - pattern: $OBJ.role = request.data[...]
          - pattern: $OBJ.role = request.data.get(...)
          - pattern: $OBJ.is_admin = request.json[...]
          - pattern: $OBJ.is_admin = request.json.get(...)
          - pattern: $OBJ.is_admin = request.data[...]
          - pattern: $OBJ.is_admin = request.data.get(...)
          - pattern: $OBJ.credits = request.json[...]
          - pattern: $OBJ.credits = request.json.get(...)
          - pattern: $OBJ.credits = request.data[...]
          - pattern: $OBJ.credits = request.data.get(...)
          - pattern: $OBJ.limit = request.json[...]
          - pattern: $OBJ.limit = request.json.get(...)
          - pattern: $OBJ.limit = request.data[...]
          - pattern: $OBJ.limit = request.data.get(...)
          - pattern: $OBJ.tier = request.json[...]
          - pattern: $OBJ.tier = request.json.get(...)
          - pattern: $OBJ.tier = request.data[...]
          - pattern: $OBJ.tier = request.data.get(...)

  - id: diana.mass-assignment-bulk-bind-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A request body is bound wholesale to a model update/create call
      (full-object bulk bind), or a privileged field (role, isAdmin,
      credits, limit, tier) is written directly from a request object,
      with no visible explicit allow-list -- maps to SEC-041 (Mass
      Assignment), static half only. Does not claim a dynamic negative
      test; does not claim SEC-042.
    patterns:
      - pattern-either:
          # Full-object bulk bind from a request body.
          - pattern: $MODEL.update(req.body)
          - pattern: $MODEL.create(req.body)
          - pattern: $MODEL.findByIdAndUpdate($ID, req.body)
          - pattern: $MODEL.updateOne($FILTER, req.body)
          - pattern: Object.assign($OBJ, req.body)
          - pattern: $QUERY.set(req.body)
          - pattern: $DOC.update(req.body)
          # Direct write of a named privileged field from request input.
          - pattern: $OBJ.role = req.body.role
          - pattern: $OBJ.role = req.body[...]
          - pattern: $OBJ.isAdmin = req.body.isAdmin
          - pattern: $OBJ.isAdmin = req.body[...]
          - pattern: $OBJ.credits = req.body.credits
          - pattern: $OBJ.credits = req.body[...]
          - pattern: $OBJ.limit = req.body.limit
          - pattern: $OBJ.limit = req.body[...]
          - pattern: $OBJ.tier = req.body.tier
          - pattern: $OBJ.tier = req.body[...]
