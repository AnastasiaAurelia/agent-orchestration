<body>
  <h1>Sign up</h1>
  <!-- Deliberate bug: the input has no name= attribute, so the browser

       always renders "Welcome, !" regardless of what the user typed. -->

    <label for="name">Your name</label>
    <input id="name" type="text">
    <button id="continue" type="submit">Continue</button>
  </form>
